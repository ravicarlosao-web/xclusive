<!DOCTYPE html>
<html lang="pt-AO" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Tema: o modo noturno (classe "dark" em <html>) é o PADRÃO para todos, sempre; a preferência do sistema operativo é ignorada.
         Só o valor exato 'claro' guardado pelo utilizador tira o escuro. Corre antes do CSS e do React (sem flash). -->
    <script>
      try { if (localStorage.getItem('xclusive_tema') === 'claro') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>

    <!-- ╔══════════════════════════════════════════╗ -->
    <!-- ║           PRIMARY SEO META TAGS          ║ -->
    <!-- ╚══════════════════════════════════════════╝ -->
    <title>Xclusive — Plataforma de Conteúdo Exclusivo para Criadores Angolanos</title>
    <meta name="description" content="Xclusive é a primeira plataforma angolana de conteúdo exclusivo. Monetiza o teu conteúdo, cresce a tua audiência e ganha dinheiro diretamente dos teus fãs — sem intermediários." />
    <meta name="keywords" content="xclusive angola, criadores de conteúdo angola, plataforma criadores angola, monetizar conteúdo angola, conteúdo exclusivo angola, fãs angola, subscripções angola, luanda criadores, influencer angola, onlyfans angola" />
    <meta name="author" content="Xclusive" />
    <!-- Indexação: este valor é o das páginas indexáveis (inicial e legais). As restantes rotas passam a «noindex, nofollow» em runtime (src/lib/robots.ts + RobotsMeta). -->
    <meta name="robots" content="index, follow" />

    <!-- ╔══════════════════════════════════════════╗ -->
    <!-- ║             GEO / LANGUAGE TAGS          ║ -->
    <!-- ╚══════════════════════════════════════════╝ -->
    <meta name="geo.region" content="AO" />
    <meta name="geo.placename" content="Angola" />
    <meta name="geo.position" content="-11.8275;17.8849" />
    <meta name="ICBM" content="-11.8275, 17.8849" />
    <meta name="language" content="Portuguese" />
    <meta http-equiv="content-language" content="pt-AO" />

    <!-- ╔══════════════════════════════════════════╗ -->
    <!-- ║           FAVICON & PWA ICONS            ║ -->
    <!-- ╚══════════════════════════════════════════╝ -->
    <!-- Ícones: ficheiros com versão no nome (-v2) para os browsers não ficarem com os antigos em cache; ao mudar os ícones, subir a versão aqui e nos ficheiros de public/.
         /favicon.ico e /apple-touch-icon.png (sem versão) existem na raiz para quem os pede por defeito. -->
    <link rel="icon" href="/favicon-v2.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-v2.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <!-- Barra do browser/app: só escuro (fundo escuro 0 0% 4%, o modo padrão do site): a variante escura e o valor de reserva sem media são o mesmo; sem variantes claras. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />

    <!-- App instalável (PWA): manifesto + meta do iOS (o Safari não usa o manifesto para o nome e o modo de ecrã inteiro). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xclusive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- ╔══════════════════════════════════════════╗ -->
    <!-- ║              PERFORMANCE                 ║ -->
    <!-- ╚══════════════════════════════════════════╝ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

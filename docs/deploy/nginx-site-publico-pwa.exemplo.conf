# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Site público como app instalável (PWA) — EXEMPLO para o bloco `server { ... }` HTTPS do site (/etc/nginx/sites-enabled/xclusive).
# NÃO mexe no painel de admin: o snippet do admin (xclusive-admin.conf) e o seu caminho secreto ficam como estão. Estes blocos só dizem respeito
# a ficheiros da raiz do site público (/sw.js, /offline.html, /manifest.webmanifest) e a /assets/.
#
# Raiz dos ficheiros do site: /var/www/xclusive  (o sw.js fica em /var/www/xclusive/sw.js).
# Depois de editar:   nginx -t && systemctl reload nginx
#
# ATENÇÃO: um `add_header` dentro de um `location` SUBSTITUI todos os do nível do `server { }`. Se o site tiver ali Strict-Transport-Security
# (ou outros), repete essas linhas em CADA bloco abaixo (está marcado «+ HSTS»).
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────

# O service worker: o browser tem de ir buscá-lo sempre à rede (no-cache = guardar mas revalidar), senão uma versão nova demora a chegar.
location = /sw.js {
    root /var/www/xclusive;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # + HSTS (se o site o usar)
}

# A página offline (o SW volta a pedi-la quando muda de versão).
location = /offline.html {
    root /var/www/xclusive;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # + HSTS
}

# O manifesto da app: tipo próprio e cache curta (1 h).
location = /manifest.webmanifest {
    root /var/www/xclusive;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    # + HSTS
}

# Ficheiros do build com hash no nome (index-AbC123.js, …): cache longa e imutável.
# `try_files $uri =404` é importante: sem isto, um ficheiro em falta cairia no `try_files … /index.html` do site e devolveria a PÁGINA do site com 200
# (HTML no lugar de JS/CSS). O service worker já recusa guardar HTML em /assets/, mas o servidor não deve mentir.
location ^~ /assets/ {
    root /var/www/xclusive;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # + HSTS
}

# Os ícones do manifesto (…-v2.png) já têm versão no nome; se ainda não tiverem uma regra própria, esta basta:
location ~ ^/(icon-(maskable-)?(192|512)-v2\.png)$ {
    root /var/www/xclusive;
    add_header Cache-Control "public, max-age=86400" always;
    # + HSTS
}

# ──────────────────────────────────────────────────────────────────
# www.xclusive.ao → https://xclusive.ao — EXEMPLO para /etc/nginx/conf.d/xclusive-www.conf (contexto `http`, FORA de qualquer server { }).
# Tudo o que chega por www (HTTPS ou HTTP) faz 301 para https://xclusive.ao$request_uri (o mesmo caminho e a mesma query, tal como foram pedidos).
# Não mexe no site principal: http://xclusive.ao/ continua a fazer o 301 que já faz para https://xclusive.ao/.
#
# Substituir os marcadores pelas MESMAS linhas do bloco `server { listen 443 ssl; ... }` do site principal (certificado e diretivas TLS):
#     __SSL_CERTIFICADO__  → o valor de `ssl_certificate` do bloco principal
#     __SSL_CHAVE__        → o valor de `ssl_certificate_key` do bloco principal
# e acrescentar aí, tal como estão no bloco principal, as outras diretivas TLS (p. ex. `include .../options-ssl-nginx.conf;`, `ssl_dhparam ...;`).
# O certificado TEM de incluir o nome www.xclusive.ao (ver docs/deploy/nginx-www-e-scanners.md, passo 0): se não incluir, o browser mostra erro de certificado
# em https://www.xclusive.ao/ em vez de seguir o redirecionamento.
#
# Atenção a nomes repetidos: se o `server_name` do bloco principal (443 ou 80) ainda listar www.xclusive.ao, o Nginx avisa «conflicting server name … ignored»
# (o bloco que for lido primeiro ganha). Tirar www.xclusive.ao desses `server_name` (ver o guia) para não haver dúvidas.
#
# Depois de copiar:   nginx -t && systemctl reload nginx
# ──────────────────────────────────────────────────────────────────

# HTTPS (www): 301 para o endereço sem www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xclusive.ao;

    ssl_certificate     __SSL_CERTIFICADO__;
    ssl_certificate_key __SSL_CHAVE__;
    # + as MESMAS diretivas TLS do bloco principal (protocolos, cifras, include do certbot, ssl_dhparam, …).

    return 301 https://xclusive.ao$request_uri;
}

# HTTP (www): 301 direto para https://xclusive.ao (sem passar por https://www).
server {
    listen 80;
    listen [::]:80;
    server_name www.xclusive.ao;

    return 301 https://xclusive.ao$request_uri;
}

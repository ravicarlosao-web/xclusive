# ──────────────────────────────────────────────────────────────────
# Rotas típicas de scanners → 404 — EXEMPLO para /etc/nginx/snippets/xclusive-scanners.conf, a incluir DENTRO do bloco `server { ... }` HTTPS do site principal:
#     include /etc/nginx/snippets/xclusive-scanners.conf;
# Hoje estes pedidos (/.env, /wp-config.php, /.aws/config, …) caem no `try_files … /index.html` do site e recebem 200 com a página da app. Passam a receber 404.
#
# Precedência das locations do Nginx (porque é que isto não afeta o resto):
#   1. `location = /x` (exata) ganha sempre: /sw.js, /offline.html, /manifest.webmanifest, /admin e /robots.txt não são tocados.
#   2. Entre os prefixos, ganha o MAIS LONGO; se esse for `^~`, o Nginx NÃO avalia expressões regulares: /assets/, o caminho secreto do admin (`^~ /__CAMINHO_ADMIN__/`)
#      e a API (`^~ /api/`) ficam fora das regras abaixo.
#   3. Senão, avaliam-se as expressões regulares NA ORDEM DO FICHEIRO e ganha a primeira que casar; só se nenhuma casar vale o prefixo mais longo (`location /`).
#   As regras abaixo só casam com caminhos que a app nunca serve (dotfiles, .php, /wp-…, cópias de segurança, ficheiros de projeto), por isso a ordem entre elas e as outras
#   regexes do site (p. ex. os ícones …-v2.png) é indiferente. Os nomes de utilizador só têm letras, números e «_» (sem pontos), por isso /perfil/<utilizador> nunca casa aqui.
# Não afeta: /, /login e as outras rotas da app (fallback para o index.html), /robots.txt, /sitemap.xml, /googleb842e010fcd2614c.html, as páginas legais, /assets/, /api/ e o admin.
#
# Depois de copiar:   nginx -t && systemctl reload nginx
# ──────────────────────────────────────────────────────────────────

# 1) Ficheiros e pastas «escondidos» (/.env, /.git/…, /.aws/config, /.npmrc, /.ssh/…, /.DS_Store, …), EXCETO /.well-known/ (validação de certificados, etc.).
location ~ /\.(?!well-known(?:/|$)) { return 404; }

# 2) PHP e WordPress (a app não tem nenhum): /x.php, /x.php/y, /wp-login.php, /wp-admin/…, /wp-content/…, /wp-includes/…
location ~* \.php(?:/|$) { return 404; }
location ^~ /wp- { return 404; }

# 3) Cópias de segurança e ficheiros temporários de editores: .bak, .old, .save, .orig, .swp e um «~» no fim.
location ~* \.(?:bak|old|save|orig|swp)$ { return 404; }
location ~ ~$ { return 404; }

# 4) Ficheiros de projeto que nunca fazem parte do site publicado.
location = /yarn.lock { return 404; }
location = /package.json { return 404; }
location = /composer.json { return 404; }

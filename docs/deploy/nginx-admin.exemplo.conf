# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Painel de admin em caminho SECRETO — EXEMPLO (não é a configuração real; o caminho real vive só fora do repositório).
#
# Incluir DENTRO do bloco `server { ... }` HTTPS já existente (o domínio, os certificados e o `location ^~ /api/` da API ficam como estão).
# Substituir o marcador __CAMINHO_ADMIN__ pelo valor de ADMIN_BASE_PATH (o MESMO usado no build do painel), por exemplo:
#     sed "s/__CAMINHO_ADMIN__/$ADMIN_BASE_PATH/g" nginx-admin.exemplo.conf > /etc/nginx/snippets/xclusive-admin.conf
#     (e no server { }:  include /etc/nginx/snippets/xclusive-admin.conf; )   depois:  nginx -t && systemctl reload nginx
#
# Os ficheiros do build ficam em /var/www/xclusive-admin/__CAMINHO_ADMIN__/  (a pasta tem o nome do caminho: `root` + prefixo, sem `alias`).
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────

# 1) O endereço antigo responde 404 simples: sem redirecionar, sem revelar o caminho novo e sem cair no index.html do site público
#    (o `try_files ... /index.html` do site devolveria 200 com a página do site, o que NÃO é um 404).
location = /admin { return 404; }
location ^~ /admin/ { return 404; }

# 2) O painel (ficheiros estáticos + recurso a index.html para as rotas internas), só debaixo do caminho secreto.
location ^~ /__CAMINHO_ADMIN__/ {
    root /var/www/xclusive-admin;
    try_files $uri /__CAMINHO_ADMIN__/index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;   # o index.html nunca fica em cache (os ficheiros /assets/ têm nome com hash)
}
location ^~ /__CAMINHO_ADMIN__/assets/ {
    root /var/www/xclusive-admin;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 3) A API do admin (/api/admin/...) NÃO muda de caminho: continua no `location ^~ /api/` existente.
#    Esse bloco tem de enviar o IP real (a API usa `trust proxy 1` e o limite de falhas por IP depende disto):
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#
#    Restrições ADICIONAIS PROPOSTAS (NÃO aplicadas; escolher conforme a operação):
#      a) Lista de IPs, se os admins tiverem IP fixo (a mais forte: o endpoint deixa de existir para o resto do mundo):
#           location ^~ /api/admin/ { allow <IP_DO_ADMIN>; deny all; proxy_pass <o mesmo destino do /api/>; (+ os mesmos proxy_set_header) }
#      b) Limite de pedidos ao login, a somar ao bloqueio da aplicação:
#           limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;      (fora do server { })
#           location = /api/admin/auth/login { limit_req zone=admin_login burst=5 nodelay; limit_req_status 429; proxy_pass <o mesmo destino>; (+ proxy_set_header) }
#      c) Sem cache em respostas do admin:  add_header Cache-Control "no-store" always;  dentro do bloco de /api/admin/.
#      d) Registo à parte (access_log /var/log/nginx/admin-api.log;) para consultar tentativas sem misturar com o tráfego público.

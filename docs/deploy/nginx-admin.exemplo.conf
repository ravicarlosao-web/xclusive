# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Painel de admin em caminho SECRETO — EXEMPLO (não é a configuração real; o caminho real vive só fora do repositório).
#
# Incluir DENTRO do bloco `server { ... }` HTTPS já existente (o domínio, os certificados e o `location ^~ /api/` da API ficam como estão).
# Substituir os marcadores pelos valores reais (que vivem só fora do repositório):
#     __CAMINHO_ADMIN__  → ADMIN_BASE_PATH (o MESMO usado no build do painel)
#     __CDN_PUBLICO__    → o nome do servidor de BUNNY_CDN_HOSTNAME (sem https://), de onde o painel mostra capas, avatares e provas públicas
#     __CDN_PRIVADO__    → o nome do servidor de BUNNY_PRIVATE_CDN_URL (sem https://), de onde o painel mostra os conteúdos pagos/KYC com URL assinado
#     sed -e "s/__CAMINHO_ADMIN__/$ADMIN_BASE_PATH/g" -e "s/__CDN_PUBLICO__/$CDN_PUBLICO/g" -e "s/__CDN_PRIVADO__/$CDN_PRIVADO/g" \
#         nginx-admin.exemplo.conf > /etc/nginx/snippets/xclusive-admin.conf
#     (e no server { }:  include /etc/nginx/snippets/xclusive-admin.conf; )   depois:  nginx -t && systemctl reload nginx
#
# Os ficheiros do build ficam em /var/www/xclusive-admin/__CAMINHO_ADMIN__/  (a pasta tem o nome do caminho: `root` + prefixo, sem `alias`).
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────

# 1) O endereço antigo responde 404 simples: sem redirecionar, sem revelar o caminho novo e sem cair no index.html do site público
#    (o `try_files ... /index.html` do site devolveria 200 com a página do site, o que NÃO é um 404).
location = /admin { return 404; }
location ^~ /admin/ { return 404; }

# 2) O painel (ficheiros estáticos + recurso a index.html para as rotas internas), só debaixo do caminho secreto.
location ^~ /__CAMINHO_ADMIN__/ {
    root /var/www/xclusive-admin;
    try_files $uri /__CAMINHO_ADMIN__/index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;   # o index.html nunca fica em cache (os ficheiros /assets/ têm nome com hash)
    # Segunda camada de segurança (só no painel; o site público não muda). Auditoria do build: scripts só do próprio painel (1 módulo, sem inline),
    # a API é do mesmo servidor (sem WebSocket), o comprovativo abre em blob: (iframe e nova aba). Só entram de fora, e só estes:
    #   - fonts.googleapis.com (CSS da fonte Inter, <link> do index.html) e fonts.gstatic.com (os ficheiros da fonte);
    #   - os 2 servidores do CDN (__CDN_PUBLICO__, __CDN_PRIVADO__): imagens e vídeos de conteúdos, denúncias e KYC.
    # Não há 'unsafe-inline' em scripts. frame-src blob: é o iframe do comprovativo.
    # 'unsafe-inline' SÓ em estilos, por uma razão exata: ao abrir qualquer janela (ex.: o comprovativo) a biblioteca Radix acrescenta um <style> com o
    # bloqueio do scroll, cujo texto muda com a largura da barra de scroll de cada browser (por isso um hash não serve) e não temos nonce. Sem isto o
    # painel funciona, mas cada janela deixa um erro de CSP na consola. Alternativa estrita (sem unsafe-inline): tirar o termo; o efeito é só esse erro.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://__CDN_PUBLICO__ https://__CDN_PRIVADO__; media-src 'self' blob: https://__CDN_PUBLICO__ https://__CDN_PRIVADO__; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Atenção: um add_header dentro de um location SUBSTITUI os do nível do server { }: se o site tiver ali Strict-Transport-Security, repetir aqui.
}
location ^~ /__CAMINHO_ADMIN__/assets/ {
    root /var/www/xclusive-admin;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;   # um .js nunca é «adivinhado» como outro tipo
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 3) A API do admin (/api/admin/...) NÃO muda de caminho: continua no `location ^~ /api/` existente.
#    Esse bloco tem de enviar o IP real (a API usa `trust proxy 1` e o limite de falhas por IP depende disto):
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#
#    Restrições ADICIONAIS PROPOSTAS (NÃO aplicadas; escolher conforme a operação):
#      a) Lista de IPs, se os admins tiverem IP fixo (a mais forte: o endpoint deixa de existir para o resto do mundo):
#           location ^~ /api/admin/ { allow <IP_DO_ADMIN>; deny all; proxy_pass <o mesmo destino do /api/>; (+ os mesmos proxy_set_header) }
#      b) Limite de pedidos ao login, a somar ao bloqueio da aplicação:
#           limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;      (fora do server { })
#           location = /api/admin/auth/login { limit_req zone=admin_login burst=5 nodelay; limit_req_status 429; proxy_pass <o mesmo destino>; (+ proxy_set_header) }
#      c) Sem cache em respostas do admin:  add_header Cache-Control "no-store" always;  dentro do bloco de /api/admin/.
#      d) Registo à parte (access_log /var/log/nginx/admin-api.log;) para consultar tentativas sem misturar com o tráfego público.

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Limite de pedidos por IP a /api/admin/* — EXEMPLO para /etc/nginx/conf.d/xclusive-limites.conf (contexto `http`, fora de qualquer server { }).
# Segunda camada, ALÉM do bloqueio de contas e de IPs que a aplicação já faz (5 falhas por conta / 20 por IP em 15 min, com escalada): o Nginx corta o excesso
# ANTES de chegar à aplicação. Só os pedidos a /api/admin/ são contados; tudo o resto (site, /api/ dos utilizadores, imagens, …) tem chave vazia e NÃO é limitado.
# As linhas `limit_req` que ligam isto ao `location /api/` do site estão em docs/deploy/nginx-limites-admin.md (passo 3).
#
# Depois de copiar:   nginx -t && systemctl reload nginx
#
# Os números são o ponto de partida (ajustar com os registos, ver o guia):
#  • geral — 20 pedidos/s por IP, rajada (burst) de 40, sem atraso (nodelay): uma página do painel faz vários pedidos de uma vez (o painel e a barra lateral
#    pedem 3 a 10 em paralelo ao abrir; os carregamentos atualizam a cada 3 s, o dashboard a cada 15 s e a barra lateral a cada 30 s). Um administrador, mesmo com
#    vários separadores, fica a 1–3 pedidos/s; várias pessoas no mesmo IP (escritório) somam, mas continuam muito abaixo de 20/s. Só um script passa dos 20/s
#    sustentados; a rajada de 40 absorve as aberturas de página sem 429. Cada IP gasta o seu próprio saldo.
#  • login — 10 pedidos/minuto por IP, rajada de 5 (nodelay): uma pessoa escreve a palavra-passe 1 a 3 vezes; a aplicação já bloqueia a conta à 5.ª falha.
#    Com burst 5 passam 6 tentativas seguidas e depois uma a cada 6 s: suficiente para enganos humanos, inútil para «password spraying» (tentar poucas
#    palavras-passe em muitas contas).
# Um pedido recusado devolve 429 e NÃO chega à aplicação: não conta como falha de login, não bloqueia a conta nem o IP, e não fica na auditoria.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────

# Chave de limitação: o IP (formato binário, curto) só para pedidos a /api/admin/…; vazia (= NÃO limitado) para tudo o resto.
# `~*` (sem distinguir maiúsculas): o Express da API aceita /api/ADMIN/… como /api/admin/…, por isso a chave tem de apanhar as duas formas.
map $request_uri $xcl_admin_chave {
    default                 "";
    ~*^/api/admin/          $binary_remote_addr;
}
# Chave só para o login do painel (/api/admin/auth/login, com ou sem ?query).
map $request_uri $xcl_admin_login_chave {
    default                              "";
    ~*^/api/admin/auth/login(\?|$)       $binary_remote_addr;
}

# 10 MB de estado guardam ~160 mil IPs (64 bytes cada); acima disso o Nginx recusa o mais antigo, nunca falha.
limit_req_zone $xcl_admin_chave       zone=xcl_admin_geral:10m  rate=20r/s;
limit_req_zone $xcl_admin_login_chave zone=xcl_admin_login:1m   rate=10r/m;

limit_req_status    429;
limit_req_log_level warn;     # os pedidos recusados ficam no error.log como «limiting requests, excess: …»

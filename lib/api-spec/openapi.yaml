      required: [id, streamId, remetenteId, valor, criadoEm]
      properties:
        id:
          type: integer
        streamId:
          type: integer
        remetenteId:
          type: integer
        valor:
          type: integer
        mensagem:
          type: ["string", "null"]
        criadoEm:
          type: string
          format: date-time


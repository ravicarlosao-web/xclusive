        mensagem:
          type: string
          maxLength: 255
        chave:
          description: Chave de idempotência (16 a 64 caracteres A-Za-z0-9_-). A mesma chave devolve a mesma mensagem sem nova cobrança.
          type: string
          minLength: 16
          maxLength: 64


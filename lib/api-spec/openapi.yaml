          type: string
        codigo:
          type: string
          enum: [chave_reutilizada]

    GorjetaMensagemInput:
      type: object
      required: [valor, chave]
      properties:
        valor:
          description: Kz inteiros, de 50 a 100 000 por gorjeta (limite diário de 300 000 Kz por remetente).

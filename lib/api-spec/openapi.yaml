      required: [id, tipo, valor, criadoEm]
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum: [subscricao, ppv, gorjeta]
        valor:
          type: number
        utilizador:
          $ref: "#/components/schemas/UserSummary"
        descricao:
          type: ["string", "null"]
        criadoEm:
          type: string
          format: date-time

    PaginatedTransactions:
      type: object
      required: [transactions, page, hasMore]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          type: integer
        hasMore:
          type: boolean

    Subscription:
      type: object
      required: [id, estado, inicioEm]
      properties:
        id:
          type: integer
        plano:
          $ref: "#/components/schemas/SubscriptionPlan"
        criador:
          $ref: "#/components/schemas/UserSummary"
        estado:
          type: string
          enum: [ativa, cancelada]
        inicioEm:
          type: string
          format: date-time
        renovacaoEm:
          type: ["string", "null"]

    SubscriptionInput:
      type: object
      required: [planoId, precoEsperado]
      properties:
        planoId:
          type: integer
        precoEsperado:
          type: number
          description: >
            Preço que o utilizador viu no UI antes de confirmar. O servidor
            rejeita o pedido (409) se o preço do plano tiver sido alterado
            entretanto, evitando débitos silenciosos por race condition.

openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Xclusive API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: posts
  - name: stories
  - name: explore
  - name: messages
  - name: live
  - name: notifications
  - name: highlights
  - name: creator

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Registar nova conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Dados inválidos

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autenticar utilizador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciais inválidas

  /auth/google/config:
    get:
      operationId: getGoogleConfig
      tags: [auth]
      summary: Configuração pública do login com o Google
      description: >-
        Devolve o ID de cliente OAuth (público). `clientId` null = login com o Google desligado neste servidor (o botão não deve aparecer).
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleConfig"

  /auth/google/nonce:
    post:
      operationId: createGoogleNonce
      tags: [auth]
      summary: Nonce para o login com o Google
      description: >-
        Põe um cookie httpOnly de uso único (5 minutos) e devolve o nonce a passar à Google. 404 se o login com o Google estiver desligado.
      responses:
        "200":
          description: Nonce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleNonce"
        "404":
          description: Login com o Google desligado
        "429":
          description: Demasiados pedidos

  /auth/google:
    post:
      operationId: googleLogin
      tags: [auth]
      summary: Entrar com o Google (ID token)
      description: >-
        Valida o ID token (assinatura RS256, iss, aud, exp, email_verificado e nonce). Conta ligada: sessão igual à do login normal.
        Sem ligação: nunca liga por email (409 `conta_existente`); conta nova só com os registos abertos (senão 403 `registos_fechados`),
        e então devolve `precisaCompletar` e um cookie com o bilhete para POST /auth/google/completar. Admins ficam excluídos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialInput"
      responses:
        "200":
          description: Sessão iniciada, ou conta nova por completar
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/GoogleCompletarPendente"
        "400":
          description: >-
            ID token recusado (inválido, expirado, nonce errado: `google_invalido`) ou email do Google não verificado (`google_email_nao_verificado`).
            É 400 e não 401 de propósito: um 401 faria o cliente tentar renovar a sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "403":
          description: Conta suspensa, encerrada ou banida, ou registos fechados (`registos_fechados`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "404":
          description: Login com o Google desligado
        "409":
          description: Já existe uma conta com este email (`conta_existente`) ou email indisponível (`email_indisponivel`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiadas tentativas
        "503":
          description: Não foi possível obter as chaves da Google (ou ler o estado dos registos)
    delete:
      operationId: unlinkGoogle
      tags: [auth]
      summary: Desligar o Google da conta
      description: Só com palavra-passe definida (senão 409 `sem_password`); a conta ficaria sem forma de entrar.
      responses:
        "200":
          description: Google desligado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResposta"
        "401":
          description: Não autenticado
        "404":
          description: Não há conta Google ligada, ou login com o Google desligado
        "409":
          description: Sem palavra-passe definida (`sem_password`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"

  /auth/google/completar:
    post:
      operationId: googleComplete
      tags: [auth]
      summary: Concluir a criação de conta com o Google
      description: >-
        Passo 2: o `sub` e o email vêm SÓ do bilhete (cookie httpOnly do passo 1), nunca do corpo (um corpo com mais campos é recusado).
        Repete o gate dos registos, a idade, o aceite dos documentos e as verificações de username e email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCompletarInput"
      responses:
        "201":
          description: Conta criada e sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Dados inválidos, menor de 18, documentos desatualizados ou bilhete inválido/expirado (`bilhete_invalido`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "403":
          description: Registos fechados (`registos_fechados`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "404":
          description: Login com o Google desligado
        "409":
          description: Username em uso, email indisponível ou Google já ligado (`google_ja_ligado`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiados registos
        "503":
          description: Não foi possível ler o estado dos registos

  /auth/google/ligar:
    post:
      operationId: linkGoogle
      tags: [auth]
      summary: Ligar o Google à conta (com sessão)
      description: >-
        A única forma de ligar o Google a uma conta existente. Se o email do Google for igual ao da conta e estiver verificado, o email da conta passa a verificado.
        Admins excluídos (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialInput"
      responses:
        "200":
          description: Google ligado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLigarResposta"
        "400":
          description: ID token recusado (`google_invalido`, `google_email_nao_verificado`); 400 e não 401 para o cliente não tentar renovar a sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "401":
          description: Não autenticado (sem sessão válida)
        "403":
          description: Conta não elegível (administrador)
        "404":
          description: Login com o Google desligado
        "409":
          description: A conta já tem Google ligado (`ja_ligado`) ou esta conta Google já está ligada a outra (`google_ja_ligado`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiadas tentativas

  /auth/google/estado:
    get:
      operationId: getGoogleStatus
      tags: [auth]
      summary: Estado da ligação ao Google da conta atual
      responses:
        "200":
          description: Estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleEstado"
        "401":
          description: Não autenticado
        "404":
          description: Login com o Google desligado

  /auth/legal-config:
    get:
      operationId: getLegalConfig
      tags: [auth]
      summary: Dados variáveis dos textos legais (público, sem autenticação)
      description: >-
        Empresa, contacto legal e regras de levantamento usadas nos textos legais. O mínimo de levantamento
        vem da mesma definição (platform_settings.min_withdrawal_amount) que valida os levantamentos.
      responses:
        "200":
          description: Configuração dos textos legais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalConfig"
        "503":
          description: Serviço temporariamente indisponível (falha a ler as definições)

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Terminar sessão
      responses:
        "200":
          description: Sessão terminada

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Utilizador autenticado
      responses:
        "200":
          description: Utilizador atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Não autenticado

  /auth/esqueci-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Pedir a recuperação da palavra-passe
      description: >-
        Resposta SEMPRE igual (202) e imediata, exista ou não a conta: a existência da conta não se revela, nem pelo tempo.
        Se existir, é enviado um email com uma ligação de uso único.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Pedido recebido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensagemResposta"
        "400":
          description: Email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiados pedidos

  /auth/redefinir-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Redefinir a palavra-passe com a ligação recebida por email
      description: Uso único. Termina todas as sessões da conta e NÃO inicia sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Palavra-passe redefinida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResposta"
        "400":
          description: Ligação inválida ou expirada (`codigo` «token_invalido») ou palavra-passe fora da regra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiados pedidos

  /auth/alterar-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Alterar a palavra-passe (com sessão)
      description: >-
        Exige a palavra-passe atual. Termina todas as sessões, incluindo a atual (a pessoa volta a entrar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Palavra-passe alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResposta"
        "400":
          description: Nova palavra-passe igual à atual (`codigo` «password_igual») ou fora da regra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "401":
          description: Não autenticado
        "403":
          description: Palavra-passe atual incorreta (`codigo` «password_incorreta»)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiados pedidos

  /auth/verificar-email/pedir:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Pedir o email de verificação do endereço da conta
      description: >-
        O endereço vem sempre da conta. 202 = email enviado; 200 com `jaVerificado` = o email já estava verificado.
        429 com `codigo` «demasiado_cedo» (e `Retry-After`) ou «limite_hora»; 503 com `codigo` «email_indisponivel».
      responses:
        "200":
          description: O email já estava verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificacaoEmailPedido"
        "202":
          description: Email de verificação enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificacaoEmailPedido"
        "401":
          description: Não autenticado
        "429":
          description: Demasiado cedo para reenviar, ou limite por hora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "503":
          description: Envio de email indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"

  /auth/verificar-email/confirmar:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Confirmar o email com a ligação recebida
      description: Uso único. Não inicia sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailInput"
      responses:
        "200":
          description: Email verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResposta"
        "400":
          description: Ligação inválida ou expirada (`codigo` «token_invalido»)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Demasiados pedidos

  # USERS
  /users/suggestions:
    get:
      operationId: getUserSuggestions
      tags: [users]
      summary: Sugestões de utilizadores para seguir
      responses:
        "200":
          description: Lista de sugestões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/me:
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Atualizar perfil do utilizador autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/blocks:
    get:
      operationId: getBlockedUsers
      tags: [users]
      summary: Contas bloqueadas pelo utilizador autenticado
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Contas bloqueadas (mais recentes primeiro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /users/{username}/block:
    post:
      operationId: blockUser
      tags: [users]
      summary: Bloquear utilizador (afeta só mensagens e novas conversas; idempotente)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bloqueado
        "400":
          description: Não é possível bloquear a própria conta
        "403":
          description: Conta de administração (não se bloqueia nem bloqueia)
        "404":
          description: Utilizador não encontrado

    delete:
      operationId: unblockUser
      tags: [users]
      summary: Desbloquear utilizador (idempotente)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Desbloqueado
        "404":
          description: Utilizador não encontrado

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Obter perfil de um utilizador
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Perfil do utilizador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Utilizador não encontrado

  /users/{username}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Seguir utilizador
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A seguir

    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Deixar de seguir utilizador
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deixou de seguir

  /users/{username}/followers:
    get:
      operationId: getUserFollowers
      tags: [users]
      summary: Seguidores do utilizador
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de seguidores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /users/{username}/following:
    get:
      operationId: getUserFollowing
      tags: [users]
      summary: Utilizadores que segue
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de seguidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /users/{username}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Posts de um utilizador
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: "Página (a partir de 1). Sem este parâmetro devolve a primeira página."
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: "Publicações por página (1 a 20)."
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPosts"

  # FEED
  /feed:
    get:
      operationId: getFeed
      tags: [posts]
      summary: Feed principal do utilizador
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
        - name: filtro
          in: query
          description: "Separador do feed: tudo (por omissão), seguindo, para-ti ou em-alta."
          schema:
            type: string
            enum: [tudo, seguindo, para-ti, em-alta]
            default: tudo
      responses:
        "200":
          description: Posts do feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPosts"

  # POSTS
  /posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Criar nova publicação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Publicação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Obter publicação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Publicação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Não encontrado

    delete:
      operationId: deletePost
      tags: [posts]
      summary: Eliminar publicação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /posts/{id}/mais18:
    patch:
      operationId: updatePostMais18
      tags: [posts]
      summary: Alterar a marcação +18 de um post próprio (só muda mais18)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMais18Input"
      responses:
        "200":
          description: Marcação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMais18"
        "400":
          description: mais18 em falta ou não boolean
        "403":
          description: O post é de outra pessoa
        "404":
          description: Post não encontrado

  /posts/{id}/enquete/voto:
    post:
      operationId: votarEnquete
      tags: [posts]
      summary: Votar numa enquete (um voto por conta, sem alterar; anónimo para os outros)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoEnqueteInput"
      responses:
        "200":
          description: A enquete atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquete"
        "400":
          description: Opção que não pertence à enquete
        "403":
          description: O autor não vota, ou a enquete é só para seguidores (codigo enquete_autor ou enquete_so_seguidores)
        "404":
          description: Post inexistente, não visível ou sem enquete
        "409":
          description: Já votaste (enquete_ja_votou) ou a enquete já terminou (enquete_encerrada)
        "429":
          description: Demasiados votos (30 por minuto)

  /posts/{id}/gorjeta:
    post:
      operationId: sendPostTip
      tags: [posts]
      summary: Enviar gorjeta a um post (idempotente com chave)
      description: Sem `chave` o pedido comporta-se como sempre. Com `chave` (16 a 64 caracteres), a mesma chave do mesmo remetente devolve a gorjeta original (mesmo estado e corpo) sem nova cobrança.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTipInput"
      responses:
        "201":
          description: Gorjeta enviada (ou repetição com a mesma chave e o mesmo pedido, sem nova cobrança)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostTipResponse"
        "400":
          description: Valor ou chave inválidos, ou gorjeta ao próprio post
        "402":
          description: Saldo insuficiente
        "404":
          description: Post não encontrado
        "409":
          description: Chave já usada com outro pedido (codigo chave_reutilizada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipKeyConflict"
        "429":
          description: Demasiadas gorjetas num curto espaço de tempo
        "503":
          description: Comissão não configurada (nada foi cobrado)

  /live/{id}/tip:
    post:
      operationId: sendLiveTip
      tags: [live]
      summary: Enviar gorjeta a uma live ativa (idempotente com chave)
      description: Sem `chave` o pedido comporta-se como sempre. Com `chave` (16 a 64 caracteres), a mesma chave do mesmo remetente devolve a gorjeta original (mesmo estado e corpo) sem nova cobrança, sem nova linha de gorjeta e sem novo evento na sala.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveTipInput"
      responses:
        "201":
          description: Gorjeta enviada (ou repetição com a mesma chave e o mesmo pedido, sem nova cobrança)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTipResponse"
        "400":
          description: Valor ou chave inválidos, live já terminada ou gorjeta à própria live
        "402":
          description: Saldo insuficiente
        "403":
          description: Live paga sem bilhete
        "404":
          description: Live não encontrada
        "409":
          description: Chave já usada com outro pedido (codigo chave_reutilizada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipKeyConflict"
        "429":
          description: Demasiadas gorjetas num curto espaço de tempo
        "503":
          description: Comissão não configurada (nada foi cobrado)


        chave:
          description: Chave de idempotência opcional (16 a 64 caracteres A-Za-z0-9_-). A mesma chave devolve a gorjeta original sem nova cobrança.
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"

    LiveTipInput:
      type: object
      required: [valor]
      properties:
        valor:
          description: Kz inteiros, positivos.
          type: integer
        mensagem:
          type: string
          maxLength: 255
        chave:
          description: Chave de idempotência opcional (16 a 64 caracteres A-Za-z0-9_-). A mesma chave devolve a gorjeta original sem nova cobrança.
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{16,64}$"


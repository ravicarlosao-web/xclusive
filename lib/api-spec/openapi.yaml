            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Valor, mensagem ou chave inválidos, ou auto-gorjeta
        "402":
          description: Saldo insuficiente (codigo saldo_insuficiente)
        "403":
          description: Bloqueaste, regra restritiva, conta de administração ou destinatário que ainda não pode receber gorjetas (campo codigo)
        "404":
          description: Conversa indisponível
        "409":
          description: Chave já usada com outro pedido
        "429":
          description: Limite diário (codigo limite_diario) ou demasiados pedidos
        "503":
          description: Comissão não configurada (nada foi cobrado)

  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Mensagens de uma conversa
      description: >-
        Sem parâmetros devolve as últimas `limite` mensagens (50 por omissão, máximo 100), por ordem crescente de id. Com `antes=<id>` devolve as
        `limite` anteriores a essa mensagem (cursor em `proximoCursor`). Com `depois=<id>` (poll da conversa aberta) devolve só as mais novas, por
        ordem crescente, e uma resposta sem novidades traz apenas `messages`, `page` e `hasMore`. `antes` e `depois` não se combinam (400).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: antes
          in: query
          required: false
          description: Id da mensagem a partir da qual se pedem as anteriores (valor de `proximoCursor`).
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: depois
          in: query
          required: false
          description: Id da última mensagem que o cliente já tem; devolve só as mais novas.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: limite
          in: query
          required: false
          description: Máximo de mensagens (50 por omissão, máximo 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Mensagens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMessages"

    post:
      operationId: sendMessage
      tags: [messages]
      summary: Enviar mensagem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true

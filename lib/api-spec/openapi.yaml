      properties:
        passwordAtual:
          type: string
          minLength: 1
          maxLength: 128
        novaPassword:
          type: string
          minLength: 8
          maxLength: 128

    ConfirmEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        lembrar:
          type: boolean
          default: false

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    # USERS
    UserProfile:
      type: object
      required: [id, username, nomeExibicao, tipoConta, verificado, privado, totalSeguidores, totalSeguindo, totalPublicacoes, criadoEm]
      properties:
        id:
          type: integer
        username:
          type: string
        nomeExibicao:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        capaUrl:
          type: ["string", "null"]
        link:
          type: ["string", "null"]
        tipoConta:
          type: string
          enum: [pessoal, criador]
        verificado:
          type: boolean
        privado:
          type: boolean
        totalSeguidores:
          type: integer
        totalSeguindo:
          type: integer
        totalPublicacoes:
          type: integer
        estaASeguir:
          type: boolean
        segueVoce:
          type: boolean
        preferenciaMais18:
          description: Só na própria conta (/auth/me, login, registo). null = ainda não escolheu.
          type: ["string", "null"]
          enum: [ver, filtrar, null]
        preferenciaMais18Em:
          type: ["string", "null"]
          format: date-time
        quemPodeEscrever:
          description: Só na própria conta (/auth/me, login, registo). Quem pode iniciar ou continuar mensagens contigo. Só criadores têm valores diferentes de "todos".
          type: string
          enum: [todos, seguidores_assinantes, assinantes]
        criadoEm:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, username, nomeExibicao, verificado]
      properties:
        id:
          type: integer
        username:
          type: string
        nomeExibicao:
          type: string
        avatarUrl:
          type: ["string", "null"]
        verificado:
          type: boolean
        tipoConta:
          type: string
        estaASeguir:
          type: boolean
        segueVoce:
          type: boolean
        totalSeguidores:
          type: integer

    ProfileUpdate:
      type: object
      properties:
        nomeExibicao:
          type: string
        bio:
          type: string
        link:
          type: string
        avatarUrl:
          type: string
        capaUrl:
          type: string
        tipoConta:
          type: string
          enum: [pessoal, criador]
        privado:
          type: boolean
        quemPodeEscrever:
          description: Só criadores podem escolher um valor diferente de "todos" (403 para os restantes).
          type: string
          enum: [todos, seguidores_assinantes, assinantes]

    PaginatedUsers:
      type: object
      required: [users, total, page, hasMore]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        total:
          type: integer
        page:
          type: integer
        hasMore:
          type: boolean

    # POSTS
    Post:
      type: object
      required: [id, autor, tipo, exclusivo, totalCurtidas, totalComentarios, guardado, curtido, criadoEm]
      properties:
        id:
          type: integer
        autor:
          $ref: "#/components/schemas/UserSummary"
        legenda:
          type: ["string", "null"]
        localizacao:
          type: ["string", "null"]
        tipo:
          type: string
          enum: [imagem, video, carrossel, texto]
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"
        exclusivo:
          type: boolean
        mais18:
          type: boolean
          description: Conteúdo +18 (marcado pela criadora). Só quem escolheu "ver" nas definições o vê; a autora vê sempre o seu.
        mais18Bloqueado:
          type: boolean
          description: Só para a autora - a equipa marcou o post como +18 (infração ativa) e ela não o pode desmarcar.
        bloqueado:
          type: boolean
        precoDesbloqueio:
          type: ["number", "null"]
        totalCurtidas:
          type: integer
        totalComentarios:
          type: integer
        curtido:
          type: boolean
        guardado:
          type: boolean
        criadoEm:
          type: string
          format: date-time
        enquete:
          $ref: "#/components/schemas/Enquete"

    VotoEnqueteInput:
      type: object
      required: [opcaoId]
      properties:
        opcaoId:
          type: integer

    Enquete:
      type: object
      description: Só existe nos posts que são enquetes. Os votos por opção só vêm a quem já votou, ao autor, ou quando a enquete terminou.
      required: [id, audiencia, terminaEm, encerrada, totalVotos, opcoes, meuVoto, podeVotar, motivo]
      properties:
        id:
          type: integer
        audiencia:
          type: string
          enum: [todos, seguidores]
        terminaEm:
          type: string
          format: date-time
        encerrada:
          type: boolean
        totalVotos:
          type: integer
        opcoes:
          type: array
          items:
            type: object
            required: [id, texto, votos, percentagem]
            properties:
              id:
                type: integer
              texto:
                type: string
              votos:
                type: ["integer", "null"]
              percentagem:
                type: ["integer", "null"]
        meuVoto:
          type: ["integer", "null"]
        podeVotar:
          type: boolean
        motivo:
          type: ["string", "null"]
          enum: [autor, seguidores, encerrada, ja_votou, null]

    PostMedia:
      type: object
      required: [id, tipo, ordem]
      properties:
        id:
          type: integer
        url:
          type: ["string", "null"]
        tipo:
          type: string
          enum: [imagem, video]
        ordem:
          type: integer
        bloqueado:
          type: boolean

    PostInput:
      type: object
      required: [tipo]
      properties:
        legenda:
          type: string
        localizacao:
          type: string
        tipo:
          type: string
          enum: [imagem, video, carrossel, texto]
        media:
          type: array
          items:
            type: object
            required: [url, tipo]
            properties:
              url:
                type: string
              tipo:
                type: string
                enum: [imagem, video]
        exclusivo:
          type: boolean
          default: false
        precoDesbloqueio:
          type: number
        mais18:
          type: boolean
          description: Marcação +18 feita pela criadora (Sim = true, Não = false). Obrigatória quando o post tem media (sem ela, 400); num post só de texto pode ser omitida e fica false. Se vier e não for boolean, 400.
        enquete:
          type: object
          description: Cria uma enquete (post de texto, gratuito e sem ficheiros; a legenda é a pergunta; mais18 fica false).
          required: [opcoes]
          properties:
            opcoes:
              type: array
              minItems: 2
              maxItems: 4
              items:
                type: string
                maxLength: 60
            duracaoDias:
              type: integer
              enum: [1, 3, 7]
              default: 1
            audiencia:
              type: string
              enum: [todos, seguidores]
              default: todos

    PostMais18Input:
      type: object
      required: [mais18]
      properties:
        mais18:
          type: boolean

    PostMais18:
      type: object
      required: [id, mais18]
      properties:

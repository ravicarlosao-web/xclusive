components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # AUTH
    RegisterInput:
      type: object
      required: [nomeCompleto, email, username, password, dataNascimento, aceite]
      properties:
        nomeCompleto:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
        dataNascimento:
          type: string
          format: date
        tipoConta:
          type: string
          enum: [pessoal, criador]
          default: pessoal
        aceite:
          type: object
          description: Versões vigentes dos documentos legais que a pessoa aceitou (GET /auth/legal-versions) e declaração de maioridade.
          required: [termos, privacidade, conteudo, direitosAutor, reembolsos, cookies, maioridade]
          properties:
            termos:
              type: string
            privacidade:
              type: string
            conteudo:
              type: string
            direitosAutor:
              type: string
            reembolsos:
              type: string
            cookies:
              type: boolean
              enum: [true]
              description: Obrigatório. Aceite de cookies e armazenamento local; só true é aceite (em falta, false ou de outro tipo => 400).
            maioridade:
              type: boolean
              enum: [true]
              description: Obrigatório. Declaração de ter 18 anos ou mais; só true é aceite (em falta, false ou de outro tipo => 400).

    LegalConfig:
      type: object
      required: [empresaNome, empresaNif, empresaSede, emailLegal, minimoLevantamento, prazoLevantamentoMin, prazoLevantamentoMax]
      properties:
        empresaNome:
          type: string
          description: Denominação da empresa (env LEGAL_EMPRESA_NOME).
        empresaNif:
          type: [string, "null"]
          description: NIF da empresa (env LEGAL_EMPRESA_NIF); null se não estiver definido.
        empresaSede:
          type: [string, "null"]
          description: Sede da empresa (env LEGAL_EMPRESA_SEDE); null se não estiver definida.
        emailLegal:
          type: string
          description: Email de contacto legal (env LEGAL_EMAIL).
        minimoLevantamento:
          type: number
          description: Mínimo de levantamento em Kz (platform_settings.min_withdrawal_amount).
        prazoLevantamentoMin:
          type: integer
          description: Prazo normal de levantamento, mínimo, em dias úteis.
        prazoLevantamentoMax:
          type: integer
          description: Prazo normal de levantamento, máximo, em dias úteis.

    CurrentUser:
      description: >-
        O utilizador autenticado (GET /auth/me): o perfil mais o estado da verificação do email.
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          properties:
            emailVerificado:
              description: O email da conta já foi verificado.
              type: boolean
            temPassword:
              description: false = conta criada com o Google que ainda não definiu palavra-passe (não tem palavra-passe atual para alterar).
              type: boolean

    GoogleConfig:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: [string, "null"]

    GoogleNonce:
      type: object
      required: [nonce]
      properties:
        nonce:
          type: string

    GoogleCredentialInput:
      type: object
      required: [credential]
      properties:
        credential:
          description: O ID token (JWT) devolvido pelo Google Identity Services.
          type: string
          minLength: 20
          maxLength: 4096

    GoogleCompletarPendente:
      type: object
      required: [precisaCompletar]
      properties:
        precisaCompletar:
          type: boolean
        nome:
          description: Nome da conta Google (para pré-preencher; pode faltar).
          type: [string, "null"]

    GoogleCompletarInput:
      type: object
      required: [username, dataNascimento, aceite]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        dataNascimento:
          type: string
          format: date
        tipoConta:
          type: string
          enum: [pessoal, criador]
        aceite:
          type: object
          description: Versões vigentes dos documentos legais que a pessoa aceitou (GET /auth/legal-versions) e declaração de maioridade.
          required: [termos, privacidade, conteudo, direitosAutor, reembolsos, cookies, maioridade]
          properties:
            termos:
              type: string
            privacidade:
              type: string
            conteudo:

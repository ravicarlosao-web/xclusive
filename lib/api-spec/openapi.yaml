        tipo:
          type: string
        valor:
          type: string
        comissao:
          type: string
        taxaComissao:
          type: ["string", "null"]
        conteudoId:
          type: ["integer", "null"]
        descricao:
          type: ["string", "null"]
        criadoEm:
          type: string
          format: date-time

    PostTipResponse:
      type: object

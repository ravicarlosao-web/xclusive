  # CONVERSATIONS / MESSAGES
  /conversations:
    get:
      operationId: getConversations
      tags: [messages]
      summary: Lista de conversas
      description: >-
        Ordenada pela última atividade (mensagem mais recente; uma conversa sem mensagens conta pela data de criação), com desempate pelo id.
        Dois modos. COM `cursor` (vazio na primeira página) pagina por cursor e devolve o envelope `{ conversas, proximoCursor }`:
        o cursor é a posição (atividade, id) da última conversa recebida, por isso uma mensagem nova a reordenar a lista não repete nem salta conversas.
        SEM `cursor` é o modo antigo (`page`/`limit`) e devolve um array simples; este modo será descontinuado (usar `cursor`).
        Esconde as conversas com contas inativas e com contas que o utilizador bloqueou.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Cursor opaco devolvido em `proximoCursor`; vazio (`cursor=`) pede a primeira página. A sua presença escolhe o modo com envelope. Inválido = 400.
          schema:
            type: string
        - name: limite
          in: query
          required: false
          description: Conversas por página no modo com `cursor` (20 por omissão, máximo 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: page
          in: query
          required: false
          deprecated: true
          description: >-
            Modo antigo (sem `cursor`): número da página, a partir de 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          deprecated: true
          description: >-
            Modo antigo (sem `cursor`): conversas por página (20 por omissão, máximo 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Conversas (array no modo antigo, envelope `{ conversas, proximoCursor }` com `cursor`)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                  - $ref: "#/components/schemas/ConversationsPage"
        "400":
          description: Cursor ou limite inválido (modo com `cursor`)

    post:
      operationId: createConversation
      tags: [messages]
      summary: Iniciar conversa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

